name: Lingua Academy UAT
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  automated-uat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dictionary and learning regression tests
        run: node --test tests/*.test.js
      - name: Execute Cloudflare D1 SQLite migrations and verify constraints
        run: python tests/test_migrations.py
      - name: Check learner application JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>\\s*([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('Inline application script missing');new Function(m[1]);const a=fs.readFileSync('auth-client.js','utf8');new Function(a);console.log('Application JavaScript syntax: PASS');"
